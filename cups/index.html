<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Find the Heart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --base:#FFF8F4; --surface:#FFFFFF; --tint:#FDECE7;
  --action:#C0405F; --action-deep:#9E2F4B;
  --ink:#3A2E33; --ink-soft:#6E5C63; --line:#F0DCD6;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--base); color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;
  display:flex; flex-direction:column; min-height:100%;
  overflow-x:hidden;
}
.blob{position:fixed; border-radius:50%; filter:blur(70px); opacity:.5; pointer-events:none; z-index:0}
.b1{width:300px;height:300px;background:var(--tint);top:-90px;left:-80px}
.b2{width:260px;height:260px;background:#F6E2EC;bottom:-80px;right:-70px}
header{
  position:relative; z-index:2; display:flex; align-items:center; gap:12px;
  padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top,0px));
}
.back{
  font-size:14px; color:var(--ink-soft); text-decoration:none;
  background:var(--surface); border:1px solid var(--line);
  padding:8px 14px; border-radius:999px; font-weight:500;
}
.back:hover{color:var(--action); border-color:var(--action)}
.title{font-family:"Playfair Display",Georgia,serif; font-size:19px; margin:0; font-weight:600}
.score{margin-left:auto; font-size:13px; color:var(--ink-soft); font-variant-numeric:tabular-nums}

main{position:relative; z-index:1; flex:1; display:flex; flex-direction:column;
     align-items:center; justify-content:center; padding:0 16px 24px; gap:26px}
.say{
  font-size:16px; color:var(--ink-soft); text-align:center; margin:0; min-height:24px;
  transition:opacity .2s ease;
}
.say b{color:var(--action); font-weight:600}

.table{position:relative; width:100%; max-width:430px; height:230px}
.cup{
  position:absolute; bottom:34px; left:0; width:96px; height:118px;
  transform:translate3d(0,0,0); cursor:pointer;
  transition:transform .32s cubic-bezier(.4,0,.2,1);
}
.cup .body{
  position:absolute; inset:0;
  background:linear-gradient(160deg,#D0566F 0%,var(--action) 46%,var(--action-deep) 100%);
  clip-path:polygon(17% 0,83% 0,100% 100%,0 100%);
  box-shadow:0 10px 22px rgba(158,47,75,.22);
}
.cup .top{
  position:absolute; left:17%; right:17%; top:-7px; height:14px; border-radius:50%;
  background:#D96C83;
}
.cup .rim{
  position:absolute; left:-2%; right:-2%; bottom:-9px; height:18px; border-radius:50%;
  background:var(--action-deep);
}
.cup .glint{
  position:absolute; left:30%; top:12%; width:9px; height:58%; border-radius:999px;
  background:rgba(255,255,255,.22);
}
.cup.lift{transition:transform .3s cubic-bezier(.34,1.3,.64,1)}
.heart{
  position:absolute; bottom:40px; left:0; width:42px; height:42px;
  display:grid; place-items:center; font-size:30px; line-height:1;
  transition:transform .3s ease, opacity .2s ease; pointer-events:none;
}
.shadow{
  position:absolute; bottom:28px; left:0; width:96px; height:14px; border-radius:50%;
  background:rgba(58,46,51,.07); transition:transform .32s cubic-bezier(.4,0,.2,1);
}
.deck{
  position:absolute; left:50%; bottom:-6px; transform:translateX(-50%);
  width:min(100%,430px); height:10px; border-radius:999px;
  background:linear-gradient(90deg,transparent,var(--line),transparent);
}

.btn{
  border:0; border-radius:999px; padding:15px 30px; font-size:16px; font-weight:600;
  font-family:inherit; cursor:pointer; background:var(--action); color:#fff;
  text-decoration:none; display:inline-block;
  box-shadow:0 10px 26px rgba(192,64,95,.25);
}
.btn:active{background:var(--action-deep)}
.btn.ghost{background:var(--surface); color:var(--ink); border:1px solid var(--line); box-shadow:none}
.row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}

/* the card */
.veil{
  position:fixed; inset:0; z-index:5; background:rgba(58,46,51,.38);
  backdrop-filter:blur(3px); display:grid; place-items:center; padding:24px;
}
.veil[hidden]{display:none}
.card{
  width:min(340px,86vw); aspect-ratio:3/4; perspective:1200px; cursor:pointer;
  background:none; border:0; padding:0; font-family:inherit;
}
.inner{
  position:relative; width:100%; height:100%; transform-style:preserve-3d;
  transition:transform .75s cubic-bezier(.4,0,.2,1);
}
.card.open .inner{transform:rotateY(180deg)}
.face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:22px; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:14px; padding:28px; text-align:center;
  box-shadow:0 24px 60px rgba(58,46,51,.3);
}
.c-front{
  background:linear-gradient(160deg,#D0566F,var(--action) 55%,var(--action-deep));
  color:#fff;
}
.c-front .seal{font-size:44px}
.c-front .lbl{font-family:"Playfair Display",Georgia,serif; font-size:22px}
.c-front .sub{font-size:13px; opacity:.85}
.c-back{
  background:var(--surface); transform:rotateY(180deg); border:1px solid var(--line);
}
.c-back .eyebrow{
  font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--action); font-weight:600;
}
.c-back .reason{
  font-family:"Playfair Display",Georgia,serif; font-size:clamp(21px,5.6vw,27px);
  line-height:1.35; margin:0; color:var(--ink);
}
.c-back .sig{font-size:13px; color:var(--ink-soft)}
.veil .after{margin-top:18px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
.veil .after[hidden]{display:none}
@media (prefers-reduced-motion:reduce){
  .cup,.heart,.shadow,.inner{transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<header>
  <a class="back" href="../">&larr; Back</a>
  <h1 class="title">Find the Heart</h1>
  <span class="score" id="score">0 cards</span>
</header>

<main>
  <p class="say" id="say">Keep your eye on the heart.</p>

  <div class="table" id="table">
    <div class="shadow" id="sh0"></div><div class="shadow" id="sh1"></div><div class="shadow" id="sh2"></div>
    <div class="heart" id="heart">&#10084;&#65039;</div>
    <div class="cup" id="cup0" data-i="0"><span class="top"></span><span class="body"></span><span class="glint"></span><span class="rim"></span></div>
    <div class="cup" id="cup1" data-i="1"><span class="top"></span><span class="body"></span><span class="glint"></span><span class="rim"></span></div>
    <div class="cup" id="cup2" data-i="2"><span class="top"></span><span class="body"></span><span class="glint"></span><span class="rim"></span></div>
    <div class="deck"></div>
  </div>

  <div class="row" id="controls">
    <button class="btn" id="start">Start</button>
  </div>
</main>

<div class="veil" id="veil" hidden>
  <div>
    <button class="card" id="card" aria-label="Open your card">
      <div class="inner">
        <div class="face c-front">
          <span class="seal">&#128140;</span>
          <span class="lbl">You found it</span>
          <span class="sub">Tap to open your card</span>
        </div>
        <div class="face c-back">
          <span class="eyebrow">Reason to love you</span>
          <p class="reason" id="reason"></p>
          <span class="sig">&mdash; Sonson</span>
        </div>
      </div>
    </button>
    <div class="after" id="after" hidden>
      <button class="btn" id="again">Play again</button>
      <a class="btn ghost" href="../">Go back</a>
    </div>
  </div>
</div>

<script>
(function(){
var REASONS = [
  "You are the most beautiful there is",
  "Your presence is so heartwarming",
  "You make me as happy as a kid",
  "You have a kindness that is out of this world",
  "You are so cool",
  "You have the most beautiful smile",
  "You have splendid hair",
  "You have this cute innocence",
  "You are so loyal",
  "You are so trustworthy",
  "You are so respectful",
  "You have the best manners",
  "You teach me etiquette",
  "You are very supportive",
  "You are so fashionable it is out of this world",
  "You are the best smelling woman out there",
  "You are my baby girl \uD83D\uDE09",
  "You stand by your family principles",
  "You are so good with kids",
  "You are so sensitive",
  "You are so caring",
  "You are sexy"
];

var el=function(id){ return document.getElementById(id); };
var cups=[el("cup0"),el("cup1"),el("cup2")];
var shadows=[el("sh0"),el("sh1"),el("sh2")];
var heart=el("heart"), table=el("table"), say=el("say");
var startBtn=el("start"), controls=el("controls"), scoreEl=el("score");
var veil=el("veil"), card=el("card"), reasonEl=el("reason"), after=el("after"), again=el("again");

var slots=[0,0,0];            // x pixel of each slot
var at=[0,1,2];               // cup i is sitting in slot at[i]
var ballCup=1;                // which CUP hides the heart (random every round)
var busy=true, round=0, cards=0;
var CUPW=96, LIFT=-92;

function used(){
  try{ return JSON.parse(localStorage.getItem("juju-reasons-v3")||"[]"); }catch(e){ return []; }
}
function saveUsed(a){ try{ localStorage.setItem("juju-reasons-v3",JSON.stringify(a)); }catch(e){} }
function nextReason(){
  var u=used();
  if(u.length>=REASONS.length) u=[];
  var pool=[];
  for(var i=0;i<REASONS.length;i++) if(u.indexOf(i)<0) pool.push(i);
  var pick=pool[Math.floor(Math.random()*pool.length)];
  u.push(pick); saveUsed(u);
  return REASONS[pick];
}

function layout(){
  var w=table.clientWidth;
  CUPW=Math.max(74,Math.min(104,Math.round(w/3.9)));
  var gap=Math.min(34,(w-CUPW*3)/3);
  var total=CUPW*3+gap*2, left=(w-total)/2;
  for(var i=0;i<3;i++){
    slots[i]=left+i*(CUPW+gap);
    cups[i].style.width=CUPW+"px";
    cups[i].style.height=Math.round(CUPW*1.22)+"px";
    shadows[i].style.width=CUPW+"px";
    shadows[i].style.transform="translate3d("+slots[i]+"px,0,0)";
  }
  place(true);
}
function slotX(i){ return slots[at[i]]; }
function place(instant){
  for(var i=0;i<3;i++){
    if(instant) cups[i].style.transition="none";
    cups[i].style.transform="translate3d("+slotX(i)+"px,0,0)";
    if(instant){ void cups[i].offsetWidth; cups[i].style.transition=""; }
  }
  moveHeart(instant);
}
function moveHeart(instant){
  var x=slotX(ballCup)+CUPW/2-21;
  if(instant) heart.style.transition="none";
  heart.style.transform="translate3d("+x+"px,0,0)";
  if(instant){ void heart.offsetWidth; heart.style.transition=""; }
}
function lift(i,on){
  cups[i].classList.toggle("lift",!!on);
  cups[i].style.transform="translate3d("+slotX(i)+"px,"+(on?LIFT:0)+"px,0)";
}
function showHeart(on){ heart.style.opacity=on?"1":"0"; }
function wait(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
function speak(t){ say.innerHTML=t; }

async function swap(a,b,ms){
  var fromA=slots[at[a]], fromB=slots[at[b]];
  var t=at[a]; at[a]=at[b]; at[b]=t;
  var toA=slots[at[a]], toB=slots[at[b]];
  cups[a].style.zIndex="3"; cups[b].style.zIndex="1";
  cups[a].style.transitionDuration=cups[b].style.transitionDuration=(ms/2000)+"s";
  heart.style.transitionDuration=(ms/1000)+"s";
  // halfway: the front cup rides up and over, the back one dips
  cups[a].style.transform="translate3d("+((fromA+toA)/2)+"px,-26px,0)";
  cups[b].style.transform="translate3d("+((fromB+toB)/2)+"px,12px,0)";
  moveHeart(false);
  await wait(ms/2);
  cups[a].style.transform="translate3d("+toA+"px,0,0)";
  cups[b].style.transform="translate3d("+toB+"px,0,0)";
  await wait(ms/2+20);
  cups[a].style.zIndex=""; cups[b].style.zIndex="";
  heart.style.transitionDuration="";
}

async function play(){
  busy=true; controls.innerHTML=""; 
  for(var q=0;q<3;q++){ lift(q,false); cups[q].classList.remove("lift"); }
  at=[0,1,2];
  ballCup=Math.floor(Math.random()*3);
  place(true);
  showHeart(true); heart.style.opacity="1";
  speak("Here it is. Watch closely.");
  for(var i=0;i<3;i++) lift(i,i===ballCup);
  await wait(1000);
  lift(1,false);
  await wait(340);
  showHeart(false);

  var n = 6 + Math.min(10, round*2);
  var ms = Math.max(170, 360 - round*22);
  speak("Where is it going...");
  for(var k=0;k<n;k++){
    var a=Math.floor(Math.random()*3), b=Math.floor(Math.random()*3);
    while(b===a) b=Math.floor(Math.random()*3);
    await swap(a,b,ms);
  }
  for(var i=0;i<3;i++) cups[i].style.transitionDuration="";
  speak("Now. <b>Which one?</b>");
  busy=false;
}

async function pick(i){
  if(busy) return;
  busy=true;
  showHeart(true);
  if(i===ballCup){
    lift(i,true);
    await wait(620);
    cards++; round++;
    scoreEl.textContent = cards + (cards===1?" card":" cards");
    speak("You found it.");
    openCard();
  }else{
    lift(i,true);
    await wait(560);
    lift(ballCup,true);
    speak("It was hiding here. One more?");
    await wait(900);
    controls.innerHTML="";
    var b=document.createElement("button");
    b.className="btn"; b.textContent="Try again";
    b.addEventListener("click",function(){ play(); });
    controls.appendChild(b);
  }
}

function openCard(){
  reasonEl.textContent = nextReason();
  card.classList.remove("open");
  after.hidden=true;
  veil.hidden=false;
}
card.addEventListener("click",function(){
  if(card.classList.contains("open")) return;
  card.classList.add("open");
  setTimeout(function(){ after.hidden=false; },700);
});
again.addEventListener("click",function(){
  veil.hidden=true;
  for(var i=0;i<3;i++) lift(i,false);
  setTimeout(play,320);
});
cups.forEach(function(c){
  c.addEventListener("click",function(){ pick(parseInt(c.dataset.i,10)); });
});
startBtn.addEventListener("click",function(){ play(); });
window.addEventListener("resize",layout);
layout(); showHeart(false);
speak("Three cups, one heart. Ready?");
})();
</script>
</body>
</html>
